# ============================================================
# Global settings shared across all services
# ============================================================
global:
  # Container registry base URL. Docker Hub (docker.io) or the cluster's
  # private registry (registry.149.222.209.65.nip.io) — see registry_setup.md.
  imageRegistry: docker.io

  # Docker Hub username/org, or a namespace prefix under the private
  # registry (e.g. "ai-apis") — REQUIRED before deploying
  imageRepository: ""

  # Default image tag applied to all service images
  imageTag: latest

  # Name of a docker-registry Secret (already created in this namespace)
  # to use as an imagePullSecret on every pod. Required when imageRegistry
  # points at the private registry (auth-gated even for pulls, see
  # registry_setup.md). Leave empty for Docker Hub public images.
  imagePullSecret: ""

  # Longhorn is used as the default storage class for all PVCs
  storageClass: longhorn

  # API key required by clients to call the AI service endpoints
  apiKey: ""

  # Admin API key used for privileged operations
  adminApiKey: ""

  # Set to true to enable MongoDB-backed persistence for API usage tracking
  useMongodb: true

  # Full MongoDB connection URL.
  # When left empty it is automatically constructed from the mongodb values below.
  # Example override: "mongodb://user:password@my-external-host:27017/"
  mongodbUrl: ""

# ============================================================
# MongoDB settings (StatefulSet)
# ============================================================
mongodb:
  # MongoDB root username
  rootUser: admin

  # MongoDB root password — change before deploying to production
  rootPassword: changeme

  # Name of the initial database to create
  database: ai_apis

  # Size of the persistent volume claim for MongoDB data
  storage: 10Gi

# ============================================================
# Whisper speech-to-text API
# ============================================================
whisper:
  # Docker image name (without registry/repository prefix)
  image: ai-apis-whisper

  # Port the FastAPI application listens on inside the container
  port: 8080

  # Hugging Face API token — needed to download gated models
  hfToken: ""

  # Size of the PVC mounted at /root/.cache for model caching. This
  # container now only runs whisperx/granite-speech/ark-asr/nemotron-asr
  # (qwen3-asr and hojo-asr split into their own containers/PVCs 2026-08-24
  # — see whisperQwen3asr/whisperHojoasr below — their dependency pins were
  # genuinely incompatible with this container's transformers>=5.8).
  cacheStorage: 20Gi

  # Default Whisper model to load on startup (e.g. turbo, large-v3)
  defaultModel: turbo

  # Which backends this container runs in-process — see
  # whisper_api.py's LOCAL_BACKENDS. Comma-separated backend names.
  localBackends: "whisperx,granite-speech,ark-asr,nemotron-asr,whisper"

  ingress:
    # Hostname for the Whisper Ingress resource (external, with TLS)
    host: whisper.example.com
    # Set to true to enable TLS (requires a cert-manager issuer or manual secret)
    tls: false
    # Internal hostname used by the bot when keda.enabled — HTTP only, no TLS.
    # Must be resolvable via the cluster's nginx ingress (nip.io or cluster DNS).
    internalHost: whisper-internal.cluster.local

# ============================================================
# Qwen3-ASR-only whisper backend (split from `whisper` above — see its
# cacheStorage comment). Internal-only, no ingress; the primary whisper
# container proxies backend=qwen3-asr requests here.
# ============================================================
whisperQwen3asr:
  image: ai-apis-whisper-qwen3asr
  port: 8080
  cacheStorage: 10Gi

# ============================================================
# Hojo-ASR-only whisper backend (split from `whisper` above — see its
# cacheStorage comment). Internal-only, no ingress; the primary whisper
# container proxies backend=hojo-asr requests here.
# ============================================================
whisperHojoasr:
  image: ai-apis-whisper-hojoasr
  port: 8080
  cacheStorage: 15Gi

# ============================================================
# Stable Diffusion image-generation API
# ============================================================
stableDiffusion:
  # Docker image name (without registry/repository prefix)
  image: ai-apis-stable-diffusion

  # Port the FastAPI application listens on inside the container
  port: 1234

  # Hugging Face API token — needed to download gated diffusion models
  hfToken: ""

  # CivitAI API key — needed to download models from civitai.com
  civitKey: ""

  # Size of the PVC mounted at /root/.cache for HuggingFace / diffusers cache
  cacheStorage: 20Gi

  # Size of the PVC mounted at /app/models for downloaded checkpoints
  modelsStorage: 50Gi

  # Size of the PVC mounted at /app/loras for LoRA adapters
  lorasStorage: 5Gi

  ingress:
    # Hostname for the Stable Diffusion Ingress resource (external, with TLS)
    host: sd.example.com
    # Set to true to enable TLS
    tls: false
    # Internal hostname used by the bot when keda.enabled — HTTP only, no TLS.
    internalHost: sd-internal.cluster.local

# ============================================================
# Text Classification / Sentiment Analysis API
# ============================================================
textClassification:
  # Docker image name (without registry/repository prefix)
  image: ai-apis-text-classification

  # Port the FastAPI application listens on inside the container
  port: 8000

  # Size of the PVC mounted at /root/.cache for transformer model caching
  cacheStorage: 10Gi

  ingress:
    # External hostname for browser/API access (nip.io or real domain).
    host: textclass.example.com
    # Internal hostname used by the bot when keda.enabled — HTTP only, no TLS.
    # Must be resolvable via the cluster's nginx ingress (nip.io or cluster DNS).
    internalHost: textclass.cluster.local
    tls: false

# ============================================================
# Telegram Bot (long-polling, no ingress required)
# ============================================================
telegramBot:
  # Docker image name (without registry/repository prefix)
  image: ai-apis-bot

  # Telegram Bot API token obtained from @BotFather
  token: ""

  # Hostname or IP of the Ollama LLM backend
  ollamaHost: ""

  # Port the Ollama service listens on
  ollamaPort: 2345

# ============================================================
# Nextcloud transcription sync (Kubernetes CronJob)
# ============================================================

# ============================================================
# KEDA HTTP add-on — scale GPU services to zero when idle
# Requires KEDA + KEDA HTTP add-on installed in the cluster.
# When enabled, the ingress routes through the KEDA interceptor which
# queues requests and scales the deployment from 0 to 1 on demand.
# GPU time-slice is released when pods are scaled to zero.
# ============================================================
keda:
  # Set to true to enable scale-to-zero for Whisper and Stable Diffusion
  enabled: false

  # Seconds of inactivity before scaling to zero (default: 30 minutes)
  idleTimeout: 1800

  # Seconds to wait for a pod to become ready before returning an error
  # during scale-from-zero. Should exceed model load time from PVC cache.
  scalingTimeout: 300

# ============================================================
# Keycloak / OIDC authentication (optional)
# Leave keycloak.url empty to use plain API key auth only.
# ============================================================
keycloak:
  # Base URL of your Keycloak server, e.g. https://keycloak.example.com
  url: ""

  # Realm name
  realm: master

  # Client ID for audience validation and Client Credentials token fetching
  clientId: ai-apis

  # Client secret for service-to-service token fetching (bot / nextcloud sync)
  clientSecret: ""

  # Realm role granting admin access
  adminRole: ai-apis-admin

  # Set to false if Keycloak uses a self-signed certificate
  verifySSL: false

# ============================================================
nextcloudSync:
  # Docker image name (without registry/repository prefix)
  image: ai-apis-nextcloud

  # Cron schedule for the sync job. Every 30min is safe here — sync_llm.py
  # and the whisper sync are both incremental (skip files already processed,
  # via sidecar/mtime tracking), so a no-op run just exits fast and cheap.
  # Runs on the hour/half-hour; nextcloudLlmSync.schedule runs 15min later
  # so it always finds this run's transcripts already done instead of
  # racing it (whisper transcription is quick, well under 15min for the
  # short test clips this pipeline has handled so far).
  schedule: "0,30 * * * *"

  # Base URL of the Nextcloud instance (e.g. https://nextcloud.example.com)
  nextcloudUrl: ""

  # Nextcloud login username (email or short name — used for authentication)
  nextcloudUser: ""

  # Internal Nextcloud username used in the WebDAV path: /remote.php/dav/files/<user>/
  # Only needed when the login credential differs from the internal username.
  # Example: nextcloudUser=user@example.com, nextcloudDavUser=username
  # Leave empty to use nextcloudUser for both auth and path.
  nextcloudDavUser: ""

  # Nextcloud password — stored in the shared Secret
  nextcloudPassword: ""

  # Remote Nextcloud folder path(s) to scan for audio/video files. List —
  # most deployments only need one entry. Rendered into a comma-separated
  # NEXTCLOUD_FOLDER env var; sync.py splits it back into a list.
  nextcloudFolders:
    - ""

  # Fixed number of speakers for diarization (leave empty for auto-detection)
  numSpeakers: ""

  # Minimum number of speakers for diarization (leave empty to disable)
  minSpeakers: ""

  # Maximum number of speakers for diarization (leave empty to disable)
  maxSpeakers: ""

  # Timeout in seconds for a single Whisper transcription request
  whisperTimeout: "3600"

# ============================================================
# Nextcloud LLM post-processing (Kubernetes CronJob)
# Independent of nextcloudSync above — never transcribes, only runs a
# hosted KubeAI LLM over transcripts nextcloudSync already produced, when a
# `<stem>.yaml` sidecar sits next to the source audio. See
# ai_apis/src/nextcloud/README_llm.md.
# ============================================================
nextcloudLlmSync:
  # Cron schedule for the LLM sync job. Every 30min is safe — skips any
  # sidecar whose output already exists (see sync_llm.py), so a no-op run
  # just exits fast and cheap. Offset 15min after nextcloudSync.schedule
  # (0,30) so this job's transcript lookups almost always find that run's
  # output already uploaded instead of racing it on the same tick.
  schedule: "15,45 * * * *"

  # Remote Nextcloud folder(s) to scan for sidecars. List.
  # Leave empty (`[]`) to reuse nextcloudSync.nextcloudFolders (the same
  # tree the whisper job scans) — override only to watch a different/subset
  # set of folders.
  nextcloudFolders: []

  # In-cluster KubeAI OpenAI-compatible endpoint. No auth needed — KubeAI
  # does not check the API key on internal (same-cluster) calls.
  llmUrl: "http://kubeai.llm.svc.cluster.local/openai/v1"

  # Default model used when a sidecar omits `llm:`
  llmDefaultModel: "glm-4-7-flash"

  # Timeout in seconds for a single LLM request. Cold model spin-up
  # (weights not yet on the KubeAI cache PVC) can take up to ~12 minutes,
  # not just the 30-60s of a warm cold-start — kept well above that.
  llmTimeout: "900"
