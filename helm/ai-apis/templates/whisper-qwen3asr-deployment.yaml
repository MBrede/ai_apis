apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-whisper-qwen3asr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-apis.labels" . | nindent 4 }}
    app.kubernetes.io/component: whisper-qwen3asr
  annotations:
    helm.sh/chart: {{ include "ai-apis.chart" . }}
spec:
  # RollingUpdate (the default) tries to create a new pod before killing the
  # old one — impossible here since both would need the same RWO PVC at
  # once, and if the old pod is unhealthy and never reaches Ready (e.g. a
  # bad image tag), the rollout deadlocks forever with the old pod stuck
  # holding the volume. Found live 2026-09-03. Recreate kills the old pod
  # first, unconditionally.
  strategy:
    type: Recreate
  # Only one replica is supported because the GPU PVC is ReadWriteOnce.
  # When keda.enabled, replicas are managed by the HTTPScaledObject (can be 0).
  {{- if not .Values.keda.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-apis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: whisper-qwen3asr
  template:
    metadata:
      labels:
        {{- include "ai-apis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: whisper-qwen3asr
    spec:
      {{- include "ai-apis.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 3600
      nodeSelector:
        {{- include "ai-apis.whisperNodeSelector" . | nindent 8 }}
      tolerations:
        {{- include "ai-apis.researchGpuToleration" . | nindent 8 }}
      containers:
        - name: whisper-qwen3asr
          image: {{ include "ai-apis.image" (dict "root" . "imageName" .Values.whisperQwen3asr.image "imageTag" .Values.whisperQwen3asr.imageTag) }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: {{ .Values.whisperQwen3asr.port }}
              protocol: TCP
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-apis-infisical-secrets
                  key: apiKey
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-apis-infisical-secrets
                  key: whisperHfToken
            - name: WHISPER_PORT
              value: {{ .Values.whisperQwen3asr.port | quote }}
            - name: WHISPER_LOCAL_BACKENDS
              value: "qwen3-asr"
            - name: USE_MONGODB
              value: "false"
            {{- include "ai-apis.keycloakEnv" . | nindent 12 }}
          volumeMounts:
            - name: whisper-qwen3asr-cache
              mountPath: /root/.cache
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 600
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              nvidia.com/gpu: 1
      volumes:
        - name: whisper-qwen3asr-cache
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-whisper-qwen3asr-cache
