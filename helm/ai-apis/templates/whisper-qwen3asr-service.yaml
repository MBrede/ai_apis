# Internal-only — no ingress. Reached via the primary whisper container's
# WHISPER_PROXY_URL_QWEN3_ASR (see whisper-deployment.yaml).
{{- if .Values.keda.enabled }}
# ── KEDA mode: app service (ClusterIP to pods, internal name) ────────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-whisper-qwen3asr-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-apis.labels" . | nindent 4 }}
    app.kubernetes.io/component: whisper-qwen3asr
  annotations:
    helm.sh/chart: {{ include "ai-apis.chart" . }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.whisperQwen3asr.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ai-apis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: whisper-qwen3asr
---
# ── KEDA mode: interceptor service (ExternalName → KEDA interceptor proxy) ───
# The proxy URL the primary whisper container calls still resolves to this
# same service name; the interceptor queues the request and scales the
# deployment 0→1 before forwarding it to the -app service above.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-whisper-qwen3asr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-apis.labels" . | nindent 4 }}
    app.kubernetes.io/component: whisper-qwen3asr
  annotations:
    helm.sh/chart: {{ include "ai-apis.chart" . }}
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
  ports:
    - name: http
      port: 8080
      protocol: TCP
{{- else }}
# ── Normal mode: direct ClusterIP service ────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-whisper-qwen3asr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-apis.labels" . | nindent 4 }}
    app.kubernetes.io/component: whisper-qwen3asr
  annotations:
    helm.sh/chart: {{ include "ai-apis.chart" . }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.whisperQwen3asr.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ai-apis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: whisper-qwen3asr
{{- end }}
