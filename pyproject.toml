[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-apis"
version = "0.1.0"
description = "AI APIs collection for LLMs, Stable Diffusion, audio transcription, and text analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["ai", "llm", "stable-diffusion", "whisper", "telegram-bot", "fastapi"]
authors = [
    { name = "AI APIs Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Core shared dependencies (minimal)
    "python-dotenv>=1.0.0",
    "requests>=2.32.3",
    "pymongo>=4.10.1",
    "motor>=3.7.0",
]

[project.optional-dependencies]
# Telegram Bot dependencies (minimal, no ML/GPU packages)
bot = [
    "python-telegram-bot>=22.5",
    "pillow>=11.0.0",  # For image handling from bot
]

# API Core (shared by all ML APIs)
api-core = [
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.10.5",
    "PyJWT[crypto]>=2.9.0",   # JWT validation for optional Keycloak auth
]

# ML Base (common ML packages shared across all ML APIs)
ml-base = [
    "torch>=2.6.0",
    "numpy>=2.2.1",
]

# Service-specific packages (without base dependencies)
# These are used when building from pre-built base image that already has api-core and ml-base
stable-diffusion-only = [
    "diffusers>=0.31.0",
    "transformers>=4.57.1",
    "accelerate>=1.2.1",
    "pillow>=11.0.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "python-multipart>=0.0.20",
    "protobuf>=6.33.0",
    "sentencepiece>=0.2.1",
]

whisper-only = [
    "openai-whisper>=20250625",
    "whisperx>=3.8.5",
    "pyannote-audio>=4.0.1",
    "ffmpeg-python>=0.2.0",
    "python-multipart>=0.0.20",
    # ARK-ASR-3B backend (whisper_api.py's ArkASRBuffer, transformers.
    # AutoModelForCausalLM(trust_remote_code=True)) and Granite-Speech-4.1
    # backend (GraniteSpeechBuffer, AutoModelForSpeechSeq2Seq) — floor raised
    # to >=5.8 for Granite per https://huggingface.co/ibm-granite/granite-speech-4.1-2b-plus
    # (2026-08-21). NOTE: this makes `ai-apis[apis]`/`ai-apis[all]` (which
    # combine whisper-only with text-analysis-only's pinned transformers==4.57.6)
    # unsatisfiable as a combo — neither extra is used together by any
    # Dockerfile in this repo (whisper and text-analysis are separate
    # containers), so this is accepted fallout, not fixed here.
    "transformers>=5.8",
    "accelerate>=1.2.1",  # required for AutoModel*.from_pretrained(device_map=...) — ArkASRBuffer/GraniteSpeechBuffer
    "librosa>=0.10.0",  # required by NemotronASRBuffer's transformers.pipeline() feature extractor
    "soundfile>=0.12.1",  # HojoASRBuffer writes diarize-turn slices to temp wav files
    # Qwen3-ASR backend (whisper_api.py's Qwen3ASRBuffer) and Hojo-ASR-V1
    # backend (HojoASRBuffer) are intentionally NOT listed here — `qwen-asr`
    # pins transformers==4.57.6 (conflicts with the >=5.8 floor above) and
    # `hojo-asr` pins torch<2.6 (conflicts with this project's torch>=2.6.0,
    # ml-base, shared by every other GPU workload in this container). Both
    # installed with --no-deps in Dockerfile.whisper/Dockerfile.whisper.hub
    # instead; see those files' comments.
]

text-analysis-only = [
    "transformers==4.57.6",
    "setfit",
    "huggingface-hub==0.36.0",
]

# Full service dependencies (including base)
# These are used when building from scratch without pre-built base image
stable-diffusion = [
    "ai-apis[api-core,ml-base,stable-diffusion-only]",
]

whisper = [
    "ai-apis[api-core,ml-base,whisper-only]",
]

text-analysis = [
    "ai-apis[api-core,ml-base,text-analysis-only]",
]

# LLM Training/Fine-tuning
llm-training = [
    "ai-apis[ml-base]",
    "transformers>=4.57.1",
    "unsloth>=2025.11.1",
    "trl>=0.13.0",
    "datasets>=3.2.0",
]

# Nextcloud sync script
nextcloud = [
    "aiohttp>=3.9.0",
    "webdavclient3>=3.14.6",
    "tqdm>=4.67.1",
    "PyJWT[crypto]>=2.9.0",   # Keycloak Client Credentials token fetching
    "pyyaml>=6.0",   # Sidecar YAML parsing for LLM post-processing
]

# Development tools
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "black>=24.10.0",
    "isort>=5.13.2",
    "mypy>=1.14.0",
    "ruff>=0.8.4",
]

# Quantization support
quantization = [
    "bitsandbytes>=0.45.0",
    "optimum>=1.24.0",
]

# CUDA-specific dependencies
cuda = [
    "nvidia-cublas-cu12>=12.1.3.1",
    "nvidia-cuda-cupti-cu12>=12.1.105",
    "nvidia-cuda-nvrtc-cu12>=12.1.105",
    "nvidia-cuda-runtime-cu12>=12.1.105",
    "nvidia-cudnn-cu12>=9.1.0.70",
]

# All APIs (no bot, no training). Excludes whisper and text-analysis: since
# Granite-Speech (whisper-only) needs transformers>=5.8, it now conflicts
# with text-analysis-only's transformers==4.57.6 pin AND (transitively
# through `all`) llm-training's unsloth<=5.x transformers ceiling. No
# Dockerfile in this repo ever installs whisper alongside either of those
# (each is its own container), so `apis`/`all` never represented a real
# combo — kept as bot+stable-diffusion+dev+quantization+cuda instead of
# chasing every other extra's transformers pin one at a time.
apis = [
    "ai-apis[stable-diffusion]",
]

# Everything including bot and training
all = [
    "ai-apis[bot,apis,llm-training,dev,quantization,cuda]",
]

[tool.uv]
# whisper/whisper-only need transformers>=5.8 (Granite-Speech backend).
# text-analysis(-only) hard-pins transformers==4.57.6, and llm-training/all
# transitively cap it via unsloth's own upper bound — genuinely incompatible
# versions of the same package. No Dockerfile in this repo ever installs
# whisper alongside any of these (separate containers), but uv's
# project-wide lock resolves every declared top-level extra into ONE mutual
# solution by default, regardless of whether anything actually combines
# them — so `uv run`/`uv lock` fails outright without this. Declaring each
# pair conflicting splits the resolution into per-extra forks instead. Full
# cross product of {whisper, whisper-only} x {the four conflicting extras}
# is listed because uv doesn't infer conflicts transitively through a
# wrapper extra (e.g. `whisper` including `whisper-only`).
conflicts = [
    [{ extra = "whisper-only" }, { extra = "text-analysis-only" }],
    [{ extra = "whisper-only" }, { extra = "text-analysis" }],
    [{ extra = "whisper-only" }, { extra = "llm-training" }],
    [{ extra = "whisper-only" }, { extra = "all" }],
    [{ extra = "whisper" }, { extra = "text-analysis-only" }],
    [{ extra = "whisper" }, { extra = "text-analysis" }],
    [{ extra = "whisper" }, { extra = "llm-training" }],
    [{ extra = "whisper" }, { extra = "all" }],
]

[project.urls]
Homepage = "https://github.com/MBrede/ai_apis"
Repository = "https://github.com/MBrede/ai_apis"
"Bug Tracker" = "https://github.com/MBrede/ai_apis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py312", "py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
py_version = 312

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from recommendations (can be added later)
    "B905",  # zip strict parameter (requires Python 3.10+)
    "B007",  # unused loop variable (often intentional)
    "B027",  # empty abstract methods (intentional for optional overrides)
    "C416",  # unnecessary comprehension (minor optimization)
    "C901",  # too complex
    "C419",  # unnecessary list comprehension (minor optimization)
    "W291",  # trailing whitespace (handled by black/editors)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/training/*.py" = ["E402", "B007", "W291"]  # Training scripts have intentional structure
"src/text_analysis/*.py" = ["E402"]  # FastAPI imports after skipped imports
"tests/*.py" = ["F841", "E402"]  # Test structure exceptions
