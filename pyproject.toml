[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-apis"
version = "0.1.0"
description = "AI APIs collection for LLMs, Stable Diffusion, audio transcription, and text analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["ai", "llm", "stable-diffusion", "whisper", "telegram-bot", "fastapi"]
authors = [
    { name = "AI APIs Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Core shared dependencies (minimal)
    "python-dotenv>=1.0.0",
    "requests>=2.32.3",
    "pymongo>=4.10.1",
    "motor>=3.7.0",
]

[project.optional-dependencies]
# Telegram Bot dependencies (minimal, no ML/GPU packages)
bot = [
    "python-telegram-bot>=22.5",
    "pillow>=11.0.0",  # For image handling from bot
]

# API Core (shared by all ML APIs)
api-core = [
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.10.5",
    "PyJWT[crypto]>=2.9.0",   # JWT validation for optional Keycloak auth
]

# ML Base (common ML packages shared across all ML APIs)
ml-base = [
    "torch>=2.6.0",
    "numpy>=2.2.1",
]

# Service-specific packages (without base dependencies)
# These are used when building from pre-built base image that already has api-core and ml-base
stable-diffusion-only = [
    "diffusers>=0.31.0",
    "transformers>=4.57.1",
    "accelerate>=1.2.1",
    "pillow>=11.0.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "python-multipart>=0.0.20",
    "protobuf>=6.33.0",
    "sentencepiece>=0.2.1",
]

whisper-only = [
    "openai-whisper>=20250625",
    "whisperx>=3.8.5",
    "pyannote-audio>=4.0.1",
    "ffmpeg-python>=0.2.0",
    "python-multipart>=0.0.20",
    # ARK-ASR-3B backend (whisper_api.py's ArkASRBuffer, transformers.
    # AutoModelForCausalLM(trust_remote_code=True)) and Granite-Speech-4.1
    # backend (GraniteSpeechBuffer, AutoModelForSpeechSeq2Seq) — floor raised
    # to >=5.8 for Granite per https://huggingface.co/ibm-granite/granite-speech-4.1-2b-plus
    # (2026-08-21).
    "transformers>=5.8",
    "accelerate>=1.2.1",  # required for AutoModel*.from_pretrained(device_map=...) — ArkASRBuffer/GraniteSpeechBuffer
    "librosa>=0.10.0",  # required by NemotronASRBuffer's transformers.pipeline() feature extractor
]

# Qwen3-ASR-1.7B backend, split into its own container (2026-08-24) — the
# `qwen-asr` PyPI package pins transformers==4.57.6, genuinely incompatible
# with whisper-only's transformers>=5.8 (confirmed: qwen-asr's own vendored
# model code fails to import against transformers>=5.8, not just a strict
# metadata pin — see Qwen3ASRBuffer's module docstring). Deployed as
# ai-apis-whisper-qwen3asr, proxied to from the primary whisper container.
whisper-qwen3asr-only = [
    "whisperx>=3.8.5",
    "pyannote-audio>=4.0.1",
    "transformers==4.57.6",
    "qwen-asr",
    "python-multipart>=0.0.20",  # FastAPI UploadFile/Form handling for /transcribe_and_diarize/
]

# Hojo-ASR-V1 backend, split into its own container (2026-08-24) — the
# `hojo-asr` PyPI package pins torch<2.6, genuinely incompatible with
# ml-base's torch>=2.6.0 (shared by every other backend). Must build from
# the from-scratch Dockerfile.whisper-hojoasr, NOT a pre-built base image —
# mbrede/ai-apis-base already has torch>=2.6.0 baked in, too late to
# downgrade once inherited. Deployed as ai-apis-whisper-hojoasr, proxied to
# from the primary whisper container.
whisper-hojoasr-only = [
    # torch/numpy declared here directly instead of via the shared ml-base
    # extra — ml-base pins torch>=2.6.0, incompatible with hojo-asr's own
    # torch<2.6. Dockerfile.whisper-hojoasr must NOT be built from
    # mbrede/ai-apis-base (already has torch>=2.6.0 baked in); build from
    # scratch instead, same shape as Dockerfile.whisper.
    # hojo-asr itself declares torch>=2.5.1,<2.6 / torchaudio>=2.5.1,<2.6 —
    # this container's whole point is honoring that, not something chosen here.
    "torch>=2.5.1,<2.6",
    "torchaudio>=2.5.1,<2.6",
    "numpy>=2.2.1",
    # whisperx>=3.8.2 all pin torch~=2.8.0/>=2.7.1 — incompatible.
    # 3.4.5/3.3.6 (the newest with no such floor) only need torch>=2.5.1.
    "whisperx>=3.4.5,<3.5",
    # pyannote-audio>=4.0.1 requires torch>=2.8.0 in every release — capped
    # to the 3.x line here, which only needs torch>=2.0.0, compatible with
    # hojo-asr's torch<2.6.
    "pyannote-audio>=3.1,<4.0",
    "soundfile>=0.12.1",  # HojoASRBuffer writes diarize-turn slices to temp wav files
    "hojo-asr",
    "python-multipart>=0.0.20",  # FastAPI UploadFile/Form handling for /transcribe_and_diarize/
]

text-analysis-only = [
    "transformers==4.57.6",
    "setfit",
    "huggingface-hub==0.36.0",
]

# Full service dependencies (including base)
# These are used when building from scratch without pre-built base image
stable-diffusion = [
    "ai-apis[api-core,ml-base,stable-diffusion-only]",
]

whisper = [
    "ai-apis[api-core,ml-base,whisper-only]",
]

whisper-qwen3asr = [
    "ai-apis[api-core,ml-base,whisper-qwen3asr-only]",
]

# No ml-base here — whisper-hojoasr-only declares its own torch<2.6.
whisper-hojoasr = [
    "ai-apis[api-core,whisper-hojoasr-only]",
]

text-analysis = [
    "ai-apis[api-core,ml-base,text-analysis-only]",
]

# LLM Training/Fine-tuning
llm-training = [
    "ai-apis[ml-base]",
    "transformers>=4.57.1",
    "unsloth>=2025.11.1",
    "trl>=0.13.0",
    "datasets>=3.2.0",
]

# Nextcloud sync script
nextcloud = [
    "aiohttp>=3.9.0",
    "webdavclient3>=3.14.6",
    "tqdm>=4.67.1",
    "PyJWT[crypto]>=2.9.0",   # Keycloak Client Credentials token fetching
    "pyyaml>=6.0",   # Sidecar YAML parsing for LLM post-processing
    "openpyxl>=3.1.0",   # batch.xlsx parsing (folder-level batch sidecar alternative)
]

# Development tools
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "black>=24.10.0",
    "isort>=5.13.2",
    "mypy>=1.14.0",
    "ruff>=0.8.4",
]

# Quantization support
quantization = [
    "bitsandbytes>=0.45.0",
    "optimum>=1.24.0",
]

# CUDA-specific dependencies
cuda = [
    "nvidia-cublas-cu12>=12.1.3.1",
    "nvidia-cuda-cupti-cu12>=12.1.105",
    "nvidia-cuda-nvrtc-cu12>=12.1.105",
    "nvidia-cuda-runtime-cu12>=12.1.105",
    "nvidia-cudnn-cu12>=9.1.0.70",
]

# All APIs (no bot, no training). Excludes whisper and text-analysis: since
# Granite-Speech (whisper-only) needs transformers>=5.8, it now conflicts
# with text-analysis-only's transformers==4.57.6 pin AND (transitively
# through `all`) llm-training's unsloth<=5.x transformers ceiling. No
# Dockerfile in this repo ever installs whisper alongside either of those
# (each is its own container), so `apis`/`all` never represented a real
# combo — kept as bot+stable-diffusion+dev+quantization+cuda instead of
# chasing every other extra's transformers pin one at a time.
apis = [
    "ai-apis[stable-diffusion]",
]

# Everything including bot and training
all = [
    "ai-apis[bot,apis,llm-training,dev,quantization,cuda]",
]

[tool.uv]
# Every extra listed below pins a mutually incompatible version of
# transformers or torch against at least one other: whisper(-only) needs
# transformers>=5.8 (Granite-Speech), whisper-qwen3asr(-only) needs
# transformers==4.57.6 exactly (qwen-asr's own vendored code, confirmed
# broken against >=5.8), whisper-hojoasr(-only) needs torch<2.6 (hojo-asr),
# text-analysis(-only) hard-pins transformers==4.57.6 with a different
# rationale, and llm-training/all transitively cap transformers via
# unsloth's own upper bound. No Dockerfile in this repo ever installs two
# of these together (each is its own container), but uv's project-wide
# lock resolves every declared top-level extra into ONE mutual solution by
# default regardless of whether anything actually combines them — so
# `uv run`/`uv lock` fails outright without this. A single conflict group
# (not pairwise entries) declares "at most one of these may be selected at
# once", which is exactly the real-world constraint.
conflicts = [
    [
        { extra = "whisper-only" },
        { extra = "whisper" },
        { extra = "whisper-qwen3asr-only" },
        { extra = "whisper-qwen3asr" },
        { extra = "whisper-hojoasr-only" },
        { extra = "whisper-hojoasr" },
        { extra = "ml-base" },
        { extra = "stable-diffusion-only" },
        { extra = "stable-diffusion" },
        { extra = "text-analysis-only" },
        { extra = "text-analysis" },
        { extra = "llm-training" },
        { extra = "apis" },
        { extra = "all" },
    ],
]

[project.urls]
Homepage = "https://github.com/MBrede/ai_apis"
Repository = "https://github.com/MBrede/ai_apis"
"Bug Tracker" = "https://github.com/MBrede/ai_apis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py312", "py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
py_version = 312

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from recommendations (can be added later)
    "B905",  # zip strict parameter (requires Python 3.10+)
    "B007",  # unused loop variable (often intentional)
    "B027",  # empty abstract methods (intentional for optional overrides)
    "C416",  # unnecessary comprehension (minor optimization)
    "C901",  # too complex
    "C419",  # unnecessary list comprehension (minor optimization)
    "W291",  # trailing whitespace (handled by black/editors)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/training/*.py" = ["E402", "B007", "W291"]  # Training scripts have intentional structure
"src/text_analysis/*.py" = ["E402"]  # FastAPI imports after skipped imports
"tests/*.py" = ["F841", "E402"]  # Test structure exceptions
